name: duit_bos
description: Aplikasi pencatatan keuangan personal
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.0.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Database lokal
  sqflite: ^2.3.3
  path: ^1.9.0

  # State management
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1

  # Grafik dashboard
  fl_chart: ^0.68.0

  # Font & UI
  google_fonts: ^6.2.1

  # Animasi
  lottie: ^3.1.2

  # Format Rupiah
  intl: ^0.19.0

  # Export/Import file
  share_plus: ^9.0.0
  file_picker: ^8.0.7
  path_provider: ^2.1.3

  # Penyimpanan preferensi lokal
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/DuitBos.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F0E6FF"
  adaptive_icon_foreground: "assets/DuitBos.png"

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
        - asset: assets/fonts/Nunito-ExtraBold.ttf
  assets:
    - assets/fonts/
    - assets/logos/BCA.png
    - assets/logos/BRI.png
    - assets/logos/Dana.png
    - assets/logos/GoPay.png
    - assets/logos/JAGO.png
    - assets/logos/Mandiri.png
    - assets/logos/OVO.png
    - assets/logos/SeaBank.png
    - assets/logos/ShoppePay.png
    - assets/DuitBos.png
