name: duit_bos
description: Aplikasi pencatatan keuangan personal
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database lokal
  sqflite: ^2.3.3
  path: ^1.9.0

  # State management
  riverpod: ^2.5.1
  flutter_riverpod: ^2.5.1

  # Grafik dashboard
  fl_chart: ^0.68.0

  # Font & UI
  google_fonts: ^6.2.1

  # Animasi
  lottie: ^3.1.2

  # Format Rupiah
  intl: ^0.19.0

  # Export/Import file
  share_plus: ^9.0.0
  file_picker: ^8.0.7
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
        - asset: assets/fonts/Nunito-ExtraBold.ttf
  assets:
    - assets/images/
    - assets/fonts/
